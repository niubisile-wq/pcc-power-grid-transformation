protocol: pcc_v2_semantic_baseline_ladder_v1
frozen_at: 2026-08-07
source_experiment: outputs/pcc_v2_attack_matrix/attack_matrix_results.csv
design:
  networks: 22
  lawful_per_network: 30
  harmful_per_family_per_network: 10
  harmful_families: [task_asset_drop, independent_merge, wrong_one_to_many, target_id_reuse, endpoint_parameter_swap, source_snapshot_mismatch]
  paired: true
  cluster: network
baselines:
  - id: B0_structural_only
    semantic_capability: none
  - id: B1_signed_artifact_v1
    semantic_capability: signed artifact hashes and declared authorization only
  - id: B2_global_identity
    semantic_capability: global relation cardinality, endpoints, evidence, and target uniqueness
  - id: B3_task_footprint
    semantic_capability: B2 plus complete task mapping, task selector preservation, and independent-intervention separation
  - id: B4_attribute_invariants
    semantic_capability: B3 plus task-required attribute invariants
  - id: B5_full_PCC_v2
    semantic_capability: B4 plus signed source-snapshot binding and the complete verifier decision
statistics:
  primary_endpoint: harmful_acceptance_rate
  secondary_endpoint: lawful_acceptance_rate
  paired_test: exact_two_sided_McNemar
  multiplicity: Holm_over_adjacent_baseline_comparisons
  uncertainty: Wilson_95_percent_interval
  effect_sizes: [absolute_risk_reduction, relative_risk, number_needed_to_gate]
  preserve_zero_event_bound: one_sided_Clopper_Pearson_95
reporting:
  controlled_attack_scope_only: true
  natural_prevalence_claim_forbidden: true
