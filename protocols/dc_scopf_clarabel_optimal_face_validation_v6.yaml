rationale:
  issue: >-
    A linear or semidefinite-quadratic dispatch problem can have a non-singleton
    optimal face. Two solvers may return different generator vectors that are
    both feasible and have the same globally optimal objective. Componentwise
    dispatch identity is therefore not a necessary solver-equivalence condition.
  correction: >-
    Promote only when both solvers report optimality, relative objectives agree,
    the independently assembled Clarabel solution satisfies every original
    Linopy constraint and bound, and aggregate generation and load shedding agree.
    Componentwise dispatch distance remains reported as an optimal-face
    diagnostic and is not deleted.
  confirmatory_case500_execution_changed: false
  objective_network_equations_costs_and_thresholds_changed: false
  result_rows_recomputed_or_filtered: false

